<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!--
  Imagem de prévia (1200x630) da raiz de diagnostico.v2o5.com.br, para
  WhatsApp e redes. Mesmo padrão da prévia dos diagnósticos de cliente
  (templates/og.html.j2 da skill): topo com a marca, régua das quatro cores.
  Gera og.jpg (LEIA-ME desta pasta). O logo é o vetor de src/lib/marca-vetor.ts.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
  :root { --tinta: #121418; --superficie: #1A1D22; --papel: #F2F1EC; --secundario: #A9ACB4; --ambar: #F2A516;
          --violeta: #6B46C8; --verde: #17773F; --azul: #2457C5;
          --violeta-claro: #9B8BE0; --verde-claro: #5CC48A; --azul-claro: #7FA3F0; --linha: rgb(242 241 236 / 0.12);
          --fonte: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: var(--tinta); color: var(--papel); font-family: var(--fonte);
         padding: 56px 64px 52px; display: grid; grid-template-rows: auto 1fr auto; gap: 24px; overflow: hidden; position: relative; isolation: isolate; }
  body::before { content: ""; position: absolute; inset: 0; z-index: -1; background:
    radial-gradient(360px 300px at 1010px 300px, rgb(242 165 22 / .18), transparent 70%),
    radial-gradient(700px 420px at 0 0, rgb(107 70 200 / .16), transparent 70%); }
  body::after { content: ""; position: absolute; left: 64px; right: 64px; top: 128px; height: 3px;
                background: linear-gradient(90deg, var(--violeta), var(--verde), var(--azul), var(--ambar)); opacity: .7; }
  .topo { display: flex; justify-content: space-between; align-items: center; }
  .marca { display: flex; gap: 14px; align-items: center; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .marca svg { height: 44px; width: auto; color: var(--papel); }
  .rotulo { font-family: var(--mono); font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--secundario); }
  .endereco { font-family: var(--mono); font-size: 19px; color: var(--secundario); }
  .meio { display: grid; grid-template-columns: minmax(0, 1fr) 330px; align-items: center; gap: 24px; padding-top: 34px; }
  .texto { display: grid; gap: 18px; }
  .texto .rotulo { color: var(--ambar); }
  h1 { font-size: 62px; line-height: 1.03; letter-spacing: -0.042em; font-weight: 600; }
  .logo { width: 330px; height: auto; }
  .jornada { display: flex; align-items: center; gap: 0; }
  .etapa { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 500; color: rgb(242 241 236 / .9); white-space: nowrap; }
  .etapa i { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--cor); display: grid; place-items: center; flex: none; }
  .etapa i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cor); }
  .liga { flex: 1; height: 2px; margin: 0 14px; background: linear-gradient(90deg, var(--de), var(--para)); opacity: .55; min-width: 18px; }
  .total { margin-left: 22px; padding: 8px 14px; border-radius: 999px; font-family: var(--mono); font-size: 17px; color: var(--ambar); box-shadow: inset 0 0 0 1.5px rgb(242 165 22 / .6); white-space: nowrap; }
</style></head>
<body>
  <div class="topo">
    <div class="marca"><svg viewBox="8 14 112 70" aria-hidden="true" focusable="false"><path d="M30 80 A18 18 0 0 1 28.09 44.1 A24 24 0 0 1 67.93 24.05 A20 20 0 0 1 99.58 44.07 A18 18 0 0 1 98 80 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><path d="M42 42 L53 55 L64 68 L75 55 L86 42" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="53" cy="55" r="6.5" fill="currentColor"/><circle cx="75" cy="55" r="6.5" fill="currentColor"/><circle cx="64" cy="68" r="4.5" fill="currentColor"/><circle cx="42" cy="42" r="4.5" fill="currentColor"/><circle cx="86" cy="42" r="5" fill="#F2A516"/></svg><span>V2O5 Vendas e Tecnologia</span></div>
    <span class="endereco">diagnostico.v2o5.com.br</span>
  </div>

  <div class="meio">
    <div class="texto">
      <span class="rotulo">Diagnóstico de presença digital</span>
      <h1>O que o cliente vê antes de chamar a sua empresa.</h1>
    </div>
    <svg class="logo" viewBox="8 14 112 70" aria-hidden="true"><path d="M30 80 A18 18 0 0 1 28.09 44.1 A24 24 0 0 1 67.93 24.05 A20 20 0 0 1 99.58 44.07 A18 18 0 0 1 98 80 Z" fill="none" stroke="#F2F1EC" stroke-width="5" stroke-linejoin="round"/><path d="M40.76,45.03c-0.44,0.13 -0.91,0.21 -1.4,0.21c-2.65,0 -4.8,-2.15 -4.8,-4.8c0,-2.65 2.15,-4.8 4.8,-4.8c2.65,0 4.8,2.15 4.8,4.8c0,0.77 -0.18,1.49 -0.5,2.14l5.25,6.21c0.85,-0.38 1.78,-0.59 2.77,-0.59c3.76,0 6.8,3.04 6.8,6.8c0,1.39 -0.42,2.68 -1.13,3.76l5.25,6.21c0.44,-0.13 0.91,-0.21 1.4,-0.21c0.49,0 0.96,0.07 1.4,0.21l5.25,-6.21c-0.72,-1.08 -1.13,-2.37 -1.13,-3.76c0,-3.76 3.04,-6.8 6.8,-6.8c0.99,0 1.92,0.21 2.77,0.59l4.02,-4.75c0.7,1.08 1.71,1.94 2.9,2.46l-4.02,4.75c0.72,1.08 1.13,2.37 1.13,3.76c0,0.87 -0.16,1.71 -0.46,2.48l5.89,4.53c0.69,-0.39 1.49,-0.61 2.34,-0.61c2.65,0 4.8,2.15 4.8,4.8c0,2.65 -2.15,4.8 -4.8,4.8c-2.65,0 -4.8,-2.15 -4.8,-4.8c0,-0.41 0.05,-0.8 0.15,-1.18l-5.89,-4.53c-1.13,0.83 -2.51,1.31 -4.02,1.31c-0.99,0 -1.92,-0.21 -2.77,-0.59l-5.25,6.21c0.32,0.64 0.5,1.37 0.5,2.14c0,2.65 -2.15,4.8 -4.8,4.8c-2.65,0 -4.8,-2.15 -4.8,-4.8c0,-0.77 0.18,-1.49 0.5,-2.14l-5.25,-6.21c-0.85,0.38 -1.78,0.59 -2.77,0.59c-1.5,0 -2.89,-0.49 -4.02,-1.31l-5.89,4.53c0.1,0.38 0.15,0.77 0.15,1.18c0,2.65 -2.15,4.8 -4.8,4.8c-2.65,0 -4.8,-2.15 -4.8,-4.8c0,-2.65 2.15,-4.8 4.8,-4.8c0.85,0 1.64,0.22 2.34,0.61l5.89,-4.53c-0.3,-0.77 -0.46,-1.6 -0.46,-2.48c0,-1.39 0.42,-2.68 1.13,-3.76z" fill="#F2F1EC"/><circle cx="88.64" cy="40.44" r="4.8" fill="#F2A516"/></svg>
  </div>

  <div class="jornada">
    <span class="etapa" style="--cor: var(--violeta-claro)"><i></i>Ser encontrada</span>
    <span class="liga" style="--de: var(--violeta); --para: var(--verde)"></span>
    <span class="etapa" style="--cor: var(--verde-claro)"><i></i>Causar boa impressão</span>
    <span class="liga" style="--de: var(--verde); --para: var(--azul)"></span>
    <span class="etapa" style="--cor: var(--azul-claro)"><i></i>Ser contatada</span>
    <span class="liga" style="--de: var(--azul); --para: var(--ambar)"></span>
    <span class="etapa" style="--cor: var(--ambar)"><i></i>Medir e proteger</span>
    <span class="total">37 verificações</span>
  </div>
</body></html>
