<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!--
  Imagem de prévia (1200x630) da raiz de diagnostico.v2o5.com.br, para
  WhatsApp e redes, na direção B do redesign 2026: papel, grade de 12
  colunas em fio claro, faixas fechadas por fio de 2 px em tinta, a rota na
  margem com a parada à altura do título, a construção do símbolo à direita
  e as quatro etapas embaixo, como estações. Gera og.jpg (LEIA-ME desta
  pasta). O símbolo é o vetor de src/lib/marca-vetor.ts, com a construção de
  src/components/marca/Construcao.tsx.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
  :root { --fundo: #F2F1EC; --cartao: #FAF9F5; --alternado: #E8E6DF; --texto: #121418; --secundario: #5A5D66; --linha: #D6D4CC; --linha-campo: #7A7972;
          --acao: #F2A516; --acao-borda: #8A5600; --violeta: #6B46C8; --verde: #17773F; --azul: #2457C5;
          --fonte: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--fundo); color: var(--texto); font-family: var(--fonte);
         display: grid; grid-template-rows: 84px 1fr 104px; }
  .faixa { position: relative; padding-left: 112px; padding-right: 56px; }
  /* A grade de 12 colunas atrás do conteúdo. */
  .grade { position: absolute; inset: 0 56px 0 112px; background-image: repeating-linear-gradient(to right, rgb(18 20 24 / .06) 0 1px, transparent 1px calc(100% / 12)); z-index: 0; }
  .faixa > :not(.grade):not(.rota) { position: relative; z-index: 1; }
  .rota { position: absolute; left: 55px; width: 2px; top: 0; bottom: 0; background: var(--linha-campo); }
  .topo { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--texto); }
  .marca { display: flex; gap: 14px; align-items: center; font-size: 25px; font-weight: 600; letter-spacing: -0.02em; }
  .marca svg { height: 38px; width: auto; color: var(--texto); }
  .endereco { font-family: var(--mono); font-size: 18px; font-weight: 500; letter-spacing: .04em; color: var(--secundario); }
  .meio { display: grid; grid-template-columns: 640px 1fr; border-bottom: 2px solid var(--texto); }
  .texto { position: relative; display: grid; align-content: center; gap: 22px; padding-right: 32px; }
  .pre { font-size: 22px; font-weight: 500; }
  h1 { font-size: 64px; line-height: 1; letter-spacing: -0.045em; font-weight: 600; }
  .parada { position: absolute; left: -68px; width: 26px; height: 26px; border-radius: 999px; border: 5px solid var(--texto); background: var(--fundo); }
  .simbolo { display: grid; place-items: center; border-left: 1px solid var(--linha); padding: 18px 0 18px 24px; }
  .construcao { width: 100%; height: auto; display: block; }
  .construcao .k-grade { stroke: var(--alternado); }
  .construcao .k-construcao { stroke: var(--linha-campo); }
  .construcao .k-no { fill: var(--texto); }
  .construcao .k-anel { stroke: var(--texto); }
  .construcao .k-anel-ambar { stroke: var(--acao); }
  .construcao .k-cota { fill: var(--secundario); font-family: var(--mono); }
  .construcao .k-cota line { stroke: var(--secundario); }
  .construcao .k-nuvem { stroke: var(--texto); }
  .construcao .k-rede { fill: var(--texto); }
  .construcao .k-ambar { fill: var(--acao); }
  .estacoes { display: grid; grid-template-columns: 1fr 1.4fr 1fr 1fr auto; }
  .estacao { position: relative; display: grid; grid-template-rows: 44px auto; align-content: start; padding-top: 16px; padding-left: 18px; border-right: 1px solid var(--linha); }
  .estacao::before { content: ""; position: absolute; left: 0; right: -1px; top: 34px; height: 8px; background: var(--cor); }
  .estacao:first-of-type::before { left: -57px; }
  .estacao i { position: relative; z-index: 1; width: 26px; height: 26px; margin-top: 9px; border-radius: 999px; border: 5px solid var(--texto); background: var(--fundo); }
  .estacao.venda i { width: 30px; height: 30px; margin-top: 7px; border-color: var(--acao-borda); background: var(--acao); }
  .estacao.venda::before { right: auto; width: 34px; }
  .estacao span { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; white-space: nowrap; }
  .total { display: flex; align-items: center; padding-left: 22px; font-family: var(--mono); font-size: 18px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
</style></head>
