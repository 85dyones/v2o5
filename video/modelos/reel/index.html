<!doctype html>
<html lang="pt-BR" data-resolution="portrait"
  data-composition-variables='[
    {"id":"gancho","type":"string","label":"Gancho (2 primeiros segundos)","default":"Seu cliente pediu preço e sumiu. Sabe por quê?"},
    {"id":"prova","type":"string","label":"Texto de apoio / fonte (até 6 palavras)","default":"Cliente sumiu?"},
    {"id":"print","type":"string","label":"Caminho da imagem de tela (opcional)","default":""},
    {"id":"cta","type":"string","label":"CTA final","default":"Descubra onde sua empresa pode funcionar melhor. Gratuitamente: link na bio."},
    {"id":"cena","type":"string","label":"Cena do meio: texto ou conversa","default":"texto"},
    {"id":"legendas","type":"string","label":"Legendas do corpo, JSON com uma frase por item","default":"[]"},
    {"id":"cfg","type":"string","label":"Configuração da cena do meio (JSON)","default":"{}"},
    {"id":"narr","type":"string","label":"Plano de tempos da narração (JSON) ou null","default":"null"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/geist-latin.woff2") format("woff2"); font-weight: 100 900; }
      :root { --papel: #F2F1EC; --cartao: #FAF9F5; --tinta: #121418; --acao: #F2A516; --apagado: #5A5D66; --linha: #D6D4CC; --claro2: #A9ACB4; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--papel); font-family: "Geist", sans-serif; color: var(--tinta); }
      /* Zonas seguras: a interface do Instagram cobre ~250 px em cima e ~420 px embaixo. Texto só entre y 250 e 1500. */
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .marca { position: absolute; left: 72px; top: 270px; display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }
      .marca i { display: block; width: 44px; height: 44px; background: var(--acao); }
      .fio { position: absolute; left: 72px; right: 72px; top: 350px; height: 3px; background: var(--tinta); }
      .bloco { position: absolute; left: 72px; right: 72px; }
      #gancho { top: 560px; font-size: 100px; line-height: 1.08; font-weight: 700; letter-spacing: -0.035em; }
      #prova { top: 440px; font-size: 84px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em; }
      #prova .ch { background: var(--acao); }
      #prova .car { background: var(--tinta); }
      #tela { top: 700px; height: 557px; border: 3px solid var(--tinta); background: var(--cartao); display: none; overflow: hidden; opacity: 0; }
      #tela img, #tela video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
      /* conversa de exemplo */
      #chat { top: 410px; border: 3px solid var(--tinta); background: var(--cartao); height: 500px; opacity: 0; display: none; overflow: hidden; }
      .chat-head { height: 104px; border-bottom: 3px solid var(--tinta); display: flex; align-items: center; gap: 22px; padding: 0 32px; background: #E8E6DF; }
      .av { width: 56px; height: 56px; border-radius: 50%; background: var(--tinta); }
      .chat-head b { font-size: 38px; font-weight: 600; letter-spacing: -0.02em; }
      .exemplo { margin-left: auto; background: var(--acao); font-size: 24px; font-weight: 700; letter-spacing: 0.06em; padding: 6px 14px; }
      .bolha { position: absolute; left: 32px; max-width: 760px; background: #fff; border: 2px solid var(--linha); padding: 24px 30px 18px; font-size: 42px; line-height: 1.2; opacity: 0; }
      .bolha em { display: block; margin-top: 10px; text-align: right; font-style: normal; font-size: 24px; color: var(--apagado); }
      #b1 { top: 150px; } #b2 { top: 310px; }
      #timer { top: 940px; height: 84px; opacity: 0; }
      #timer .t { position: absolute; left: 0; top: 0; height: 84px; display: flex; align-items: center; gap: 20px; background: var(--tinta); color: var(--papel); padding: 0 32px 0 22px; font-size: 40px; font-weight: 600; letter-spacing: -0.02em; opacity: 0; white-space: nowrap; }
      .relogio { position: relative; width: 44px; height: 44px; border: 4px solid var(--acao); border-radius: 50%; display: block; flex: none; }
      .relogio u { position: absolute; left: 50%; bottom: 50%; width: 4px; background: var(--acao); transform-origin: 50% 100%; margin-left: -2px; }
      .relogio .h1 { height: 12px; } .relogio .h2 { height: 17px; }
      /* cenas de motion do meio */
      #cena { position: absolute; left: 72px; right: 72px; top: 430px; height: 680px; display: flex; flex-direction: column; justify-content: center; }
      #cena > * { width: 100%; }
      #cena > .etiqueta { width: auto; }
      #cena .etiqueta { position: absolute; right: 0; top: -52px; background: var(--acao); font-size: 24px; font-weight: 700; letter-spacing: 0.06em; padding: 6px 14px; }
      .barras { display: flex; flex-direction: column; gap: 22px; }
      .linha .lt { display: flex; justify-content: space-between; align-items: baseline; font-size: 38px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px; }
      .linha .nt { font-style: normal; font-size: 34px; font-weight: 700; background: var(--acao); padding: 0 12px; }
      .trilho { height: 52px; border: 3px solid var(--tinta); background: #E8E6DF; }
      .enche { display: block; height: 100%; width: 0; }
      .caminho { position: relative; display: flex; flex-direction: column; }
      .caminho .no { position: relative; min-height: 100px; border: 3px solid var(--tinta); background: var(--cartao); padding: 18px 28px; display: flex; flex-direction: column; justify-content: center; }
      .caminho .no b { font-size: 42px; font-weight: 700; letter-spacing: -0.025em; }
      .caminho .no small { font-size: 28px; color: var(--apagado); margin-top: 2px; }
      .caminho .lig { width: 4px; height: 40px; background: var(--tinta); margin-left: 60px; }
      .quest { position: absolute; right: 28px; top: 20px; width: 60px; height: 60px; background: var(--acao); font-size: 42px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
      .ok { position: absolute; right: 24px; top: 26px; background: var(--acao); font-size: 28px; font-weight: 700; padding: 8px 16px; }
      .token { position: absolute; right: 24px; top: 0; z-index: 3; background: var(--acao); font-size: 30px; font-weight: 700; padding: 10px 22px; border: 3px solid var(--tinta); }
      .chips { display: flex; gap: 14px; margin-top: 24px; flex-wrap: wrap; }
      .chips span { background: var(--tinta); color: var(--papel); font-size: 32px; font-weight: 600; padding: 12px 22px; }
      .comp { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }
      .col h3 { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 4px solid var(--linha); }
      .col.bom h3 { border-bottom-color: var(--acao); }
      .col .item { font-size: 37px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; padding: 20px 22px; margin-bottom: 16px; border: 3px solid var(--tinta); background: var(--cartao); }
      .col.ruim .item { background: #E8E6DF; color: var(--apagado); border-color: var(--linha); }
      .col.bom .item u { text-decoration: none; display: inline-block; background: var(--acao); width: 40px; height: 40px; text-align: center; margin-right: 14px; font-size: 30px; line-height: 40px; }
      .numero { text-align: center; }
      .numero .fonte { display: inline-block; background: var(--acao); font-size: 30px; font-weight: 700; padding: 8px 18px; margin-bottom: 28px; }
      .numero .grande { font-size: 330px; line-height: 0.95; font-weight: 700; letter-spacing: -0.06em; }
      .numero .suf { font-size: 120px; letter-spacing: -0.03em; margin-left: 18px; }
      .numero .rot { font-size: 46px; font-weight: 600; margin-top: 18px; }
      .numero .extra { display: inline-block; margin-top: 26px; background: var(--tinta); color: var(--papel); font-size: 38px; font-weight: 600; padding: 12px 26px; }
      .celulas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
      .cel { height: 100px; border: 3px solid var(--tinta); background: var(--cartao); }
      .grade .q { text-align: center; margin-top: 26px; }
      .grade .q span { display: block; font-size: 190px; line-height: 0.9; font-weight: 700; letter-spacing: -0.05em; }
      .grade .q small { font-size: 42px; font-weight: 600; color: var(--apagado); }
      .chatg { position: relative; border: 3px solid var(--tinta); background: var(--cartao); }
      .chatg .chat-head { height: 84px; }
      .msgs { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
      .m { max-width: 720px; padding: 12px 20px; font-size: 32px; line-height: 1.2; border: 2px solid var(--linha); background: #fff; }
      .m.c { align-self: flex-start; }
      .m.a { align-self: flex-end; background: #F7E2B5; border-color: var(--acao); }
      .selo { align-self: center; background: var(--tinta); color: var(--papel); font-size: 30px; font-weight: 600; padding: 8px 22px; }
      /* legendas do corpo */
      #legendas { top: 1090px; height: 340px; }
      #legendas p { position: absolute; left: 0; right: 0; top: 0; font-size: 58px; line-height: 1.14; font-weight: 700; letter-spacing: -0.03em; }
      /* padrão v2 (reel dos 4 minutos): gancho escuro, legenda curta com um destaque, relógio, frase de efeito e chamada de compartilhar */
      mark.hl { background: var(--acao); color: var(--tinta); padding: 0 0.12em; margin: 0 -0.02em; }
      #legendas p.v2 { font-size: 78px; line-height: 1.1; letter-spacing: -0.035em; opacity: 0; }
      #hook { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: var(--tinta); color: var(--papel); z-index: 6; }
      #hook .hm { position: absolute; left: 72px; top: 270px; display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }
      #hook .hm i { display: block; width: 44px; height: 44px; background: var(--acao); }
      #hook .hf { position: absolute; left: 72px; right: 72px; top: 350px; height: 3px; background: #2E3138; }
      #hook h1 { position: absolute; left: 72px; right: 72px; top: 600px; font-size: 112px; line-height: 1.08; font-weight: 700; letter-spacing: -0.04em; }
      #hook .hn { position: absolute; left: 72px; top: 1180px; font-size: 32px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A9ACB4; }
      #relogio { position: absolute; left: 72px; right: 72px; top: 385px; height: 150px; }
      #relogio .rt { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 26px; opacity: 0; font-size: 150px; line-height: 1; font-weight: 700; letter-spacing: -0.05em; }
      #relogio .rb { font-size: 34px; letter-spacing: 0.04em; background: var(--acao); padding: 6px 16px; margin-top: 8px; }
      #punch { position: absolute; left: 90px; right: 90px; top: 560px; font-size: 100px; line-height: 1.08; font-weight: 700; letter-spacing: -0.04em; opacity: 0; }
      #compart { position: absolute; left: 90px; top: 1040px; opacity: 0; }
      #compart span { display: inline-block; border: 3px solid var(--papel); font-size: 40px; font-weight: 600; letter-spacing: -0.01em; padding: 18px 30px; }
      /* final animado */
      #fim { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: var(--tinta); color: var(--papel); }
      #fim svg { position: absolute; left: 230px; top: 440px; width: 620px; height: 388px; overflow: visible; }
      #fim .nome { position: absolute; left: 0; right: 0; top: 880px; text-align: center; font-size: 176px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; }
      #fim .nome span { display: inline-block; opacity: 0; }
      #fim .sub { position: absolute; left: 0; right: 0; top: 1090px; text-align: center; font-size: 44px; font-weight: 500; color: var(--claro2); letter-spacing: 0.01em; }
      #fim .barra { position: absolute; left: 480px; top: 1160px; width: 120px; height: 6px; background: var(--acao); transform: scaleX(0); transform-origin: 50% 50%; }
      #fim .chamada { position: absolute; left: 90px; right: 90px; top: 1210px; text-align: center; font-size: 52px; line-height: 1.16; font-weight: 600; letter-spacing: -0.025em; }
      .pw { display: inline-block; padding: 0 0.07em; margin: 0 -0.02em; opacity: 0; }
      #fim .acc { color: var(--acao); font-weight: 700; }
      .ch { position: relative; display: inline-block; opacity: 0; white-space: pre; }
      .car { position: absolute; right: -0.06em; top: 0.12em; bottom: 0.06em; width: 0.07em; background: var(--acao); opacity: 0; }
      #fim .pilula { position: absolute; left: 0; right: 0; top: 1385px; text-align: center; opacity: 0; }
      #fim .pilula span { display: inline-block; background: var(--acao); color: var(--tinta); font-size: 46px; font-weight: 700; padding: 14px 34px; letter-spacing: -0.01em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURACAO}}" data-width="1080" data-height="1920">
      <div class="marca" id="marca"><i></i>V2O5 Vendas e Tecnologia</div>
      <div class="fio" id="fio"></div>
      <h1 id="gancho" class="bloco"></h1>
      <div id="prova" class="bloco"></div>
      <div id="tela" class="bloco">{{VIDEO_TAG}}<img alt="" /></div>
      <div id="chat" class="bloco">
        <div class="chat-head"><div class="av"></div><b>Cliente</b><span class="exemplo">EXEMPLO</span></div>
        <div class="bolha" id="b1">Oi! Quanto custa o serviço?<em>14:02</em></div>
        <div class="bolha" id="b2">Já fechei com outra empresa. Obrigado.<em>no dia seguinte</em></div>
      </div>
      <div id="timer" class="bloco">
        <div class="t"><i class="relogio"><u class="h1"></u><u class="h2"></u></i>Sem resposta há 3 min</div>
        <div class="t"><i class="relogio"><u class="h1"></u><u class="h2"></u></i>Sem resposta há 47 min</div>
        <div class="t"><i class="relogio"><u class="h1"></u><u class="h2"></u></i>Sem resposta há 5 h</div>
        <div class="t"><i class="relogio"><u class="h1"></u><u class="h2"></u></i>Sem resposta há 1 dia</div>
      </div>
      <div id="cena"></div>
      <div id="relogio"></div>
      <div id="legendas" class="bloco"></div>
      <div id="hook"><div class="hm"><i></i>V2O5 Vendas e Tecnologia</div><div class="hf"></div><h1></h1><div class="hn"></div></div>
      <div id="fim">
        <svg viewBox="{{VIEWBOX}}" aria-hidden="true">
          <path id="nuvem" d="{{NUVEM}}" fill="none" stroke="#F2F1EC" stroke-width="{{TRACO}}" stroke-linejoin="round" />
          <path id="rede" d="{{REDE}}" fill="#F2F1EC" />
          <circle id="anel" cx="{{AMBAR_CX}}" cy="{{AMBAR_CY}}" r="{{AMBAR_R}}" fill="none" stroke="#F2A516" stroke-width="1.2" opacity="0" />
          <circle id="ambar" cx="{{AMBAR_CX}}" cy="{{AMBAR_CY}}" r="{{AMBAR_R}}" fill="#F2A516" />
        </svg>
        <div class="nome" id="nome"></div>
        <div class="barra" id="barra"></div>
        <div class="sub" id="sub">Vendas e Tecnologia</div>
        <div class="chamada" id="chamada"></div>
        <div class="pilula" id="pilula"><span></span></div>
        <div id="punch"></div><div id="compart"><span></span></div>
      </div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const cfg = JSON.parse(v.cfg || "{}");
      const N = JSON.parse(v.narr || "null");
      const V2 = !!(N && N.v2);
      // [trecho] vira o destaque âmbar de legenda
      const marcar = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\[([^\]]+)\]/g, '<mark class="hl">$1</mark>').replace(/\|/g, "<br>");
      const D = {{DURACAO}}, G = {{GANCHO_DUR}}, E = {{FIM_INICIO}};
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // gancho digitado
      const gTxt = String(v.gancho);
      if (V2) {
        // gancho escuro com destaque (padrão v2): corte seco para a cena clara em G
        const maiorLinha = (t) => Math.max(...String(t).split("|").map((s) => s.replace(/[\[\]]/g, "").length));
        const mh = maiorLinha(N.hook.texto);
        $("#hook h1").style.fontSize = (mh > 26 ? 88 : mh > 20 ? 96 : mh > 16 ? 104 : 112) + "px";
        $("#hook h1").innerHTML = marcar(N.hook.texto);
        $("#hook .hn").textContent = N.hook.nota || "";
        tl.fromTo("#hook h1", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo("#hook .hn", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.6);
        tl.set("#hook", { autoAlpha: 0 }, G);
      } else {
        digitar($("#gancho"), [{ t: gTxt }], N ? N.ganchoStart : 0.15, N ? N.ganchoVel : 0.032, false, { pausa: N ? N.ganchoPausa : 0.7, quebra: true });
        tl.to("#gancho", { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, G - 0.3);
        tl.set("#hook", { autoAlpha: 0 }, 0);
      }

      // legendas do corpo: palavra por palavra, com a palavra da vez em destaque
      function legendar() {
        const frases = JSON.parse(v.legendas || "[]");
        const pesos = frases.map((f) => f.split(/\s+/).length);
        const soma = pesos.reduce((a, b) => a + b, 0) || 1;
        const janela = MEIO1 - MEIO0 - 0.3;
        let t = MEIO0 + 0.2; const ts = [];
        const box = $("#legendas");
        if (V2) {
          // legenda curta, com um destaque fixo, entrando de uma vez e saindo antes da próxima
          frases.forEach((f, i) => {
            const p = document.createElement("p"); p.className = "v2"; box.appendChild(p);
            p.innerHTML = marcar(f);
            if (f.replace(/[\[\]]/g, "").length > 34) p.style.fontSize = "66px";
            const tt = N.tempos[i].t, dur = N.tempos[i].d;
            ts.push(tt);
            tl.fromTo(p, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, tt);
            if (i < frases.length - 1) tl.to(p, { opacity: 0, duration: 0.18, ease: "power1.in" }, tt + dur - 0.05);
          });
          return ts;
        }
        frases.forEach((f, i) => {
          const p = document.createElement("p"); box.appendChild(p);
          p.style.fontSize = (f.length > 100 ? 48 : f.length > 80 ? 53 : 58) + "px";
          const dur = N ? N.tempos[i].d : janela * pesos[i] / soma;
          const tt = N ? N.tempos[i].t : t;
          ts.push(tt);
          destacar(p, f, tt + 0.05, dur * (N ? 0.95 : 0.82));
          if (i < frases.length - 1) tl.to(p, { opacity: 0, duration: 0.2, ease: "power1.in" }, N ? tt + dur + 0.08 : tt + dur - 0.22);
          t += dur;
        });
        return ts;
      }
      // ---- cenas de motion do meio (dirigidas pelo cfg do reel) ----
      const cena = $("#cena");
      function el(cls, html, pai) { const e = document.createElement("div"); if (cls) e.className = cls; if (html) e.innerHTML = html; (pai || cena).appendChild(e); return e; }
      // âncora: tempo em que começa a frase i (aceita fração: 1.5 fica no meio entre a frase 1 e a 2)
      const A = (ts, i) => { const k = Math.min(Math.floor(i || 0), ts.length - 1); const prox = ts[Math.min(k + 1, ts.length - 1)]; const dt = k + 1 < ts.length ? prox - ts[k] : 2; return ts[k] + dt * ((i || 0) - Math.floor(i || 0)) + 0.15; };
      const pop = (e, t, extra) => tl.fromTo(e, { opacity: 0, y: 34 }, Object.assign({ opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, extra || {}), t);
      const CENAS = {
        barras(c, ts) {
          if (c.tag) el("etiqueta", c.tag);
          const box = el("barras");
          c.linhas.forEach((l) => {
            const r = el("linha", `<div class="lt"><span>${l.rotulo}</span><em class="nt">${l.nota || ""}</em></div><div class="trilho"><i class="enche"></i></div>`, box);
            const fill = r.querySelector(".enche"), nt = r.querySelector(".nt");
            fill.style.background = l.cor === "acao" ? "#F2A516" : l.cor === "apagado" ? "#A9ACB4" : "#121418";
            const t0 = A(ts, l.a); pop(r, t0);
            if (l.cresce != null) { gsap.set(fill, { width: (l.v0 || 8) + "%" }); tl.to(fill, { width: l.v + "%", duration: 1.2, ease: "power2.inOut" }, A(ts, l.cresce)); }
            else { tl.to(fill, { width: l.v + "%", duration: 0.9, ease: "power2.out" }, t0 + 0.15); }
            if (l.na != null) tl.fromTo(nt, { opacity: 0 }, { opacity: 1, duration: 0.3 }, A(ts, l.na));
            if (l.destaque != null) tl.set(fill, { backgroundColor: "#F2A516" }, A(ts, l.destaque));
          });
        },
        caminho(c, ts) {
          const box = el("caminho"); const nos = [];
          c.nos.forEach((n, i) => { if (i) el("lig", "", box); nos.push(el("no", `<b>${n.rotulo}</b>${n.sub ? `<small>${n.sub}</small>` : ""}`, box)); });
          nos.forEach((e, i) => {
            const n = c.nos[i], t0 = A(ts, n.a != null ? n.a : i);
            pop(e, t0);
            const lig = e.previousElementSibling;
            if (lig && lig.classList.contains("lig")) { gsap.set(lig, { scaleY: 0, transformOrigin: "50% 0%" }); tl.to(lig, { scaleY: 1, duration: 0.25, ease: "none" }, t0 - 0.3); }
            if (n.destaque) tl.set(e, { backgroundColor: "#F7E2B5" }, t0 + 0.3);
            if (n.pergunta) {
              const q = el("quest", "?", e); tl.fromTo(q, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, t0 + 0.3);

        chat(c, ts) {

          const ms = box.querySelector(".msgs");

      };

      const MEIO0 = G, MEIO1 = E - 0.55;
      if (v.cena === "conversa") {
        $("#chat").style.display = "block";
        const ts = legendar();
        // cartão da conversa
        tl.fromTo("#chat", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, MEIO0 + 0.1);
        tl.fromTo("#b1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, ts[0] + 0.3);

        document.querySelectorAll("#timer .h2").forEach((h) => tl.to(h, { rotation: 1440, duration: MEIO1 - marcos[0], ease: "none" }, marcos[0]));
        document.querySelectorAll("#timer .h1").forEach((h) => tl.to(h, { rotation: 120, duration: MEIO1 - marcos[0], ease: "none" }, marcos[0]));
        tl.fromTo("#b2", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, marcos[3] + 0.15);
        ["#chat", "#timer", "#legendas"].forEach((s) => tl.to(s, { opacity: 0, duration: 0.25 }, E - 0.6));
      } else if (CENAS[v.cena]) {
        $("#legendas").style.cssText = "top:1130px;height:300px;";
        const ts2 = legendar();
        tl.fromTo("#cena", { opacity: 0 }, { opacity: 1, duration: 0.3 }, MEIO0 + 0.1);
        const temRelogio = V2 && N.relogio && N.relogio.length;

        CENAS[v.cena](cfg, ts2);
        if (temRelogio) {

          N.relogio.forEach((r, k) => {

            const t0 = A(ts2, r.a) - 0.15, prox = N.relogio[k + 1];

            if (prox) tl.to(e, { opacity: 0, duration: 0.12 }, A(ts2, prox.a) - 0.15);
            else tl.to(e, { opacity: 0, duration: 0.25 }, E - 0.6);
          });
        }
        if (V2) {
          // encolhe a cena se ela passar da área disponível
          const area = temRelogio ? 515 : 680;
          const filhos = [...$("#cena").children].filter((c) => !c.classList.contains("etiqueta"));
          const soma = filhos.reduce((a, c) => a + c.getBoundingClientRect().height, 0);
          if (soma > area) filhos.forEach((c) => (c.style.zoom = String(Math.max(0.7, area / soma))));
        }
        ["#cena", "#legendas"].forEach((q) => tl.to(q, { opacity: 0, duration: 0.25 }, E - 0.6));
      } else if (v.cena === "tela") {
        $("#prova").style.cssText = "top:410px;font-size:66px;";
        $("#tela").style.cssText = "display:block;top:540px;left:0;right:0;height:643px;border-left:0;border-right:0;";
        $("#legendas").style.cssText = "top:1235px;height:250px;";
        document.querySelectorAll("#legendas p").forEach((q) => (q.style.fontSize = "50px"));
        digitar($("#prova"), [{ t: String(v.prova) }], G + 0.1, 0.035, true);
        if (v.print) $("#tela img").src = v.print; else $("#tela img").style.display = "none";
        tl.fromTo("#tela", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, G + 0.1);
        legendar();
        document.querySelectorAll("#legendas p").forEach((q) => (q.style.fontSize = "50px"));
        ["#prova", "#tela"].forEach((q) => tl.to(q, { opacity: 0, duration: 0.25 }, E - 0.6));
      } else {
        digitar($("#prova"), [{ t: String(v.prova) }], G + 0.1, 0.035, true);
        if (v.print) { const t2 = $("#tela"); t2.style.display = "block"; t2.querySelector("img").src = v.print; }
        tl.fromTo("#tela", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, G + 0.1);
      }

      // final animado com o símbolo da V2O5
      const partes = String(v.cta).split(":");
      const principal = partes[0].replace(/\.$/, "").trim();
      const corte = principal.lastIndexOf(". ");
      const segs = corte > 0 ? [{ t: principal.slice(0, corte + 1) + " " }, { t: principal.slice(corte + 2) + ".", c: "acc" }] : [{ t: principal }];
      // legenda dinâmica: as palavras entram uma a uma e a palavra da vez ganha o destaque âmbar
      function destacar(el, texto, t0, dur) {
        el.innerHTML = "";
        const palavras = texto.split(/\s+/);
        const total = palavras.reduce((a, w) => a + w.length + 1, 0);
        let acum = 0;
        const spans = palavras.map((w) => { const sp = document.createElement("span"); sp.className = "pw"; sp.textContent = w; el.appendChild(sp); el.appendChild(document.createTextNode(" ")); return sp; });
        spans.forEach((sp, i) => {
          const ti = t0 + dur * acum / total;
          acum += palavras[i].length + 1;
          const tf = i < spans.length - 1 ? t0 + dur * acum / total : ti + 0.45;
          gsap.set(sp, { scale: 0.8, transformOrigin: "50% 70%" });

          tl.set(sp, { backgroundColor: "#F2A516", color: "#121418" }, ti);

        });
      }
      // texto digitado: cada letra aparece em seguida, com o cursor âmbar na última
      function digitar(el, segmentos, t0, vel, espacosComoLetra, opcoes) {
        el.innerHTML = ""; let t = t0; let fimDeFrase = false;
        const op = opcoes || {};
        segmentos.forEach((seg) => {
          seg.t.split(/(\s+)/).forEach((parte) => {
            if (!parte) return;
            if (/^\s+$/.test(parte)) {
              // pausa dramática no fim da frase; com `quebra`, a frase seguinte começa em outra linha
              if (fimDeFrase && op.pausa) {
                t += op.pausa; fimDeFrase = false;
                if (op.quebra) { el.appendChild(document.createElement("br")); return; }
              }
              if (espacosComoLetra) { const e = document.createElement("span"); e.className = "ch"; e.textContent = " "; el.appendChild(e); tl.set(e, { opacity: 1 }, t); }
              else el.appendChild(document.createTextNode(" "));
              t += vel; return;
            }
            const w = document.createElement("span"); w.style.whiteSpace = "nowrap"; w.style.display = "inline-block"; if (seg.c) w.className = seg.c;
            [...parte].forEach((ch) => {
              const sp = document.createElement("span"); sp.className = "ch"; sp.textContent = ch;
              const c = document.createElement("i"); c.className = "car"; sp.appendChild(c); w.appendChild(sp);
              tl.set(sp, { opacity: 1 }, t); tl.set(c, { opacity: 1 }, t); tl.set(c, { opacity: 0 }, t + vel); t += vel;
            });
            el.appendChild(w);
            fimDeFrase = /[.?!]$/.test(parte);
          });
        });
        return t;
      }
      const pil = (partes[1] || "link na bio").replace(/\.$/, "").trim();
      $("#pilula span").textContent = pil.charAt(0).toUpperCase() + pil.slice(1);
      "V2O5".split("").forEach((c) => { const s = document.createElement("span"); s.textContent = c; $("#nome").appendChild(s); });
      const comp = $("#nuvem").getTotalLength();

        $("#punch").style.fontSize = (mp > 22 ? 76 : mp > 18 ? 84 : mp > 14 ? 92 : 100) + "px";

        tl.fromTo("#punch", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, E + 0.25);
        tl.fromTo("#compart", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, E + 2.3);
        tl.to(["#punch", "#compart"], { opacity: 0, duration: 0.25 }, EL - 0.3);

      const fimChamada = digitar($("#chamada"), segs, N ? N.fimTexto0 : Math.max(EL + 2.45, fimSub + 0.1), N ? N.fimVel : 0.02, false, { pausa: 0.3 });
      tl.fromTo("#pilula", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, fimChamada + 0.15);
      tl.to("#fim", { opacity: 0, duration: 0.4, ease: "power1.in" }, D - 0.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
