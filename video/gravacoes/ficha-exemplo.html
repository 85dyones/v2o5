<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Ficha de exemplo</title>
<style>
@font-face{font-family:Geist;src:url("../modelos/reel/assets/geist-latin.woff2") format("woff2");font-weight:100 900}
*{margin:0;box-sizing:border-box}body{width:1260px;height:750px;background:#F2F1EC;font-family:Geist,sans-serif;color:#121418;padding:56px 72px}
.sel{display:inline-block;background:#F2A516;font-weight:700;font-size:22px;padding:6px 14px;letter-spacing:.04em}
h1{font-size:54px;letter-spacing:-.03em;margin:22px 0 6px}p.s{font-size:24px;color:#5A5D66;margin-bottom:34px}
table{width:100%;border-collapse:collapse;font-size:30px}td{padding:13px 0;border-top:2px solid #D6D4CC}td:first-child{width:320px;color:#5A5D66}td:last-child{font-weight:600}
tr{opacity:0;animation:e .5s ease-out forwards}tr:nth-child(1){animation-delay:1.2s}tr:nth-child(2){animation-delay:2.2s}tr:nth-child(3){animation-delay:3.0s}tr:nth-child(4){animation-delay:3.8s}tr:nth-child(5){animation-delay:4.6s}@keyframes e{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}h1,.s,.sel{opacity:0;animation:e .5s ease-out forwards}h1{animation-delay:.3s}.s{animation-delay:.7s}
</style></head><body>
<span class="sel">EXEMPLO · dados fictícios</span>
<h1>Cliente novo</h1><p class="s">O contato chega com a origem anotada na lista de clientes.</p>
<table>
<tr><td>Nome</td><td>Mariana Souza (exemplo)</td></tr>
<tr><td>Como achou</td><td>Google, perfil do negócio</td></tr>
<tr><td>Primeira conversa</td><td>WhatsApp, sábado 10h12</td></tr>
<tr><td>Interesse</td><td>Banho e tosa</td></tr>
<tr><td>Atendido por</td><td>Agente de IA, passou para a Ana</td></tr>
</table></body></html>
